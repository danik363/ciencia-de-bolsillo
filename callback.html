<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connecting - Ciencia de Bolsillo</title>
<link rel="stylesheet" href="estilo.css"></head><body><main>
<h1>Connecting to TikTok...</h1>
<p id="m">Please wait.</p>
<p><a href="publicar.html">Back to publish page</a></p>
</main>
<script>
(async () => {
  const q = new URLSearchParams(location.search), m = document.getElementById("m");
  try {
    if (q.get("error")) throw new Error(q.get("error_description") || q.get("error"));
    if (q.get("state") !== sessionStorage.getItem("estado")) throw new Error("Invalid state, please log in again.");
    const r = await fetch("http://127.0.0.1:8765/intercambiar", {method: "POST", body: JSON.stringify({code: q.get("code")})});
    const j = await r.json(); if (!r.ok) throw new Error(j.error);
    sessionStorage.removeItem("estado");
    location.replace("publicar.html");
  } catch (e) { m.textContent = "Error: " + e.message; }
})();
</script></body></html>
